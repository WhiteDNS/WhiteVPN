name: Connection engine validation
on:
  pull_request:
    paths: ['app/**', 'native/engines/**', 'native/amneziawg/**', 'scripts/*engine*', 'scripts/*tor*', 'scripts/*amnezia*', '.github/workflows/connection-engines.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3'}
      - name: Select installed NDK
        run: |
          ndk_root=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$ndk_root"
          echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
      - name: Build minimal gomobile library
        run: python3 scripts/build-enginecore.py
      - name: Build Tor and transports
        run: |
          NDK="$ANDROID_NDK_HOME" bash scripts/build-tor-engine.sh
          python3 scripts/build-tor-transports.py
      - name: Build pinned AmneziaWG
        run: python3 scripts/build-amneziawg.py
      - name: Verify required artifacts
        run: python3 scripts/verify-engine-artifacts.py --require core tor amneziawg --write-manifest build/engines/public-native-checksums.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-engines
          path: |
            app/libs/enginecore.aar
            app/src/main/jniLibs/*/libamneziawg.so
            build/engines/amneziawg-build.json
            app/src/main/jniLibs/*/libtor.so
            app/src/main/jniLibs/*/libobfs4proxy.so
            app/src/main/jniLibs/*/libsnowflake.so
            app/src/main/jniLibs/*/libconjure.so
            build/engines/public-native-checksums.json
            build/engines/enginecore-build.json
            build/engines/enginecore-go.sum
  android:
    needs: public-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3'}
      - uses: actions/download-artifact@v4
        with: {name: public-engines, path: '.'}
      - name: Restore executable permissions and check artifact integrity
        run: |
          find app/src/main/jniLibs -type f -name '*.so' -exec chmod +x {} +
          python3 scripts/verify-engine-artifacts.py --require core tor amneziawg --checksums build/engines/public-native-checksums.json
      - name: Unit tests and builds
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:compileReleaseKotlin :app:minifyReleaseWithR8 :app:assembleDebugAndroidTest --console=plain
      - name: Inspect final universal APK
        run: |
          python3 scripts/verify-engine-artifacts.py --apk app/build/outputs/apk/debug/app-universal-debug.apk --require core tor amneziawg --write-manifest build/engines/apk-native-checksums.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-validation
          path: |
            app/build/outputs/apk/
            app/build/reports/tests/
            app/build/test-results/
            build/engines/*checksums.json
