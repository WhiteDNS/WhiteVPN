android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# No org.gradle.java.home here: it pinned one contributor's Homebrew path and broke the build on
# every other machine. The daemon JDK comes from gradle/gradle-daemon-jvm.properties (Java 21),
# falling back to JAVA_HOME. Set org.gradle.java.home in your own gradle.properties if you need to.
